name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Strapi env fictif pour que le build CMS ne plante pas sur env() manquants
  APP_KEYS: "test1,test2"
  API_TOKEN_SALT: test
  ADMIN_JWT_SECRET: test
  TRANSFER_TOKEN_SALT: test
  JWT_SECRET: test
  ENCRYPTION_KEY: test
  # Next env
  NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
  NEXT_PUBLIC_STRAPI_TOKEN: ""
  NEXT_PUBLIC_SITE_URL: https://assohorsdutemps.fr

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Lint (web)
        run: pnpm --filter @hors-du-temps/web lint

      - name: Unit tests (web)
        run: pnpm --filter @hors-du-temps/web test

      - name: Build (web)
        run: pnpm --filter @hors-du-temps/web build

      # E2E — activé dès Chunk 2 (shell Next)
      # - name: Install Playwright browsers
      #   run: pnpm --filter @hors-du-temps/web exec playwright install --with-deps chromium
      # - name: E2E tests
      #   run: pnpm --filter @hors-du-temps/web test:e2e
